name: scorecard
description: Offline Cricket and Football scorecard app for Windows and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  pdf: ^3.10.8
  printing: ^5.12.0
  archive: any
  xml: any
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  window_manager: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
